name: 每日早报推送

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 北京时间 08:00 → daily_note.py
    - cron: "30 0 * * *"  # 北京时间 08:30 → DailyNews.py

jobs:
  run_daily_note:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install requests
      - name: 执行 daily_note.py
        run: python daily_note.py

  run_daily_news:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install requests
      - name: 执行 DailyNews.py
        run: python DailyNews.py
